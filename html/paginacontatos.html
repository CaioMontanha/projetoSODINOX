```html
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contato - SODINOX</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body{
      background:#111;
      color:#f5f5f5;
    }

    header{
      background:linear-gradient(to bottom,#2a2a2a,#111);
      padding:20px 5%;
      border-bottom:3px solid #999;
    }

    .topo{
      display:flex;
      justify-content:space-between;
      align-items:center;
      flex-wrap:wrap;
      gap:20px;
    }

    .logo img{
      width:260px;
      max-width:100%;
    }

    nav a{
      color:#fff;
      text-decoration:none;
      margin-left:25px;
      font-weight:bold;
      transition:.3s;
    }

    nav a:hover{
      color:silver;
    }

    .banner{
      height:40vh;
      display:flex;
      justify-content:center;
      align-items:center;
      text-align:center;

      background:
      linear-gradient(rgba(0,0,0,.7),rgba(0,0,0,.8)),
      url('../images/soldagem inox.jpg');

      background-size:cover;
      background-position:center;
    }

    .banner h1{
      font-size:3rem;
      color:silver;
      text-transform:uppercase;
    }

    .contato{
      padding:80px 5%;
      display:flex;
      justify-content:center;
      align-items:center;
    }

    .box{
      background:#1c1c1c;
      padding:50px;
      border-radius:12px;
      border:1px solid #333;
      width:100%;
      max-width:600px;
      text-align:center;
    }

    .box h2{
      color:silver;
      margin-bottom:30px;
      font-size:2rem;
    }

    .info{
      margin-bottom:25px;
    }

    .info h3{
      color:silver;
      margin-bottom:10px;
    }

    .info p{
      color:#ddd;
      font-size:1.1rem;
    }

    .btn{
      display:inline-block;
      margin-top:20px;
      padding:15px 35px;
      background:silver;
      color:#111;
      text-decoration:none;
      font-weight:bold;
      border-radius:6px;
      transition:.3s;
    }

    .btn:hover{
      background:#fff;
      transform:scale(1.05);
    }

    footer{
      background:#000;
      text-align:center;
      padding:30px;
      border-top:2px solid #333;
    }

    footer p{
      color:#999;
    }

    @media(max-width:768px){

      .banner h1{
        font-size:2rem;
      }

      nav{
        width:100%;
        text-align:center;
      }

      nav a{
        display:inline-block;
        margin:10px;
      }

      .topo{
        justify-content:center;
      }

      .box{
        padding:35px 25px;
      }

    }

  </style>
</head>

<body>

  <header>

    <div class="topo">

      <div class="logo">

      </div>

        <a href="#">Contato</a>
      </nav>

    </div>

  </header>

  <section class="banner">
    <h1>Contato</h1>
  </section>

  <section class="contato">

      <div class="info">

      </div>

      <div class="info">

      © 2026 SODINOX - Todos os direitos reservados.
    </p>
  </footer>

</body>
</html>
